# Git hooks (lefthook). Keep these local checkpoints fast; CI owns the full
# repository-wide gate matrix.
# Install: `node scripts/install-lefthook.mjs` (runs automatically via postinstall).

pre-commit:
  jobs:
    - name: translation pairing (staged records)
      glob: '*.i18n.yaml'
      exclude:
        - '.agents/notes/archived/**'
      run: node_modules/.bin/tsx scripts/verify-translation-pairing.ts --cached {staged_files}

    - name: archived agent notes
      glob: '.agents/notes/archived/**'
      run: node_modules/.bin/tsx scripts/verify-archived-agent-notes.ts

    - name: lint (staged)
      glob: '*.{ts,tsx,mts,cts,mjs}'
      exclude:
        - 'vendor/*/src/**'
      run: node_modules/.bin/tsx scripts/run-oxlint.ts --config .oxlintrc.staged.json --fix --no-error-on-unmatched-pattern {staged_files}
      stage_fixed: true

    - name: whitespace (staged)
      run: git diff --cached --check

    - name: pi-ai provider metadata
      glob: '{pnpm-lock.yaml,packages/llm/llm-pi-ai/package.json,packages/llm/llm-pi-ai/scripts/gen-provider-data.ts,packages/llm/llm-pi-ai/src/provider-data.generated.ts}'
      run: node_modules/.bin/tsx packages/llm/llm-pi-ai/scripts/gen-provider-data.ts --check --cached

    - name: vendor manifest guard
      run: scripts/check-vendor-manifest.sh

pre-merge-commit:
  jobs:
    - name: translation pairing (staged records)
      glob: '*.i18n.yaml'
      exclude:
        - '.agents/notes/archived/**'
      run: node_modules/.bin/tsx scripts/verify-translation-pairing.ts --cached {staged_files}

    - name: archived agent notes
      glob: '.agents/notes/archived/**'
      run: node_modules/.bin/tsx scripts/verify-archived-agent-notes.ts

pre-push:
  jobs:
    - name: typecheck
      # 该链的 build:lib:host 末尾会调 `pnpm --filter … run`，而 pnpm 11 的
      # verify-deps-before-run 会拿 node_modules/.pnpm-workspace-state-v1.json 逐键比对
      # 当前配置。玲珑打包脚本的 `pnpm deploy --prod --config.node-linker=hoisted` 会在
      # 仓库根把这份状态改写成 prod + hoisted，此后任何 `pnpm run` 都判定依赖失配，去跑
      # 需要先删掉 isolated node_modules 的 `pnpm install --production`，无 TTY 时即以
      # ERR_PNPM_ABORTED_REMOVE_MODULES_DIR_NO_TTY 中止。pnpm 只认 pnpm_config_* 前缀
      # （npm_config_* 无效），写在 run 上会随整条命令链传递。
      run: pnpm_config_verify_deps_before_run=false npm run typecheck

    # 启动器前端的布局不变量：高度是否随模式/状态跳动、地址框两行预留、输入框封顶。
    # 这些只有真实布局看得见，DOM 桩测试覆盖不到，因此放在唯一的推送出口上。
    # 直接跑 node（不经过包管理器），且工具在找不到 Chromium 时打印原因并跳过，
    # 不会因为某台机器没装浏览器而堵住推送。
    - name: launcher frontend layout
      glob: 'apps/linyaps/desktop-launcher/frontend/**'
      run: node apps/linyaps/desktop-launcher/frontend/tools/preview.mjs verify
