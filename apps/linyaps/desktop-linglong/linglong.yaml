version: "1"
package:
  id: com.deepseek.dsh-desktop
  name: deepseek-harness-desktop
  # 版本必须高于此前 Go + Wails 薄壳版发布的 0.1.7.2：玲珑按版本号判定升级，
  # 低于已安装版本的包会被当作版本倒退拒绝。本版取代薄壳版，沿用同一个应用 ID，
  # 用户的桌面图标、启动器登记与数据目录因此保持不变。
  version: 0.2.0.11
  kind: app
  description: |
    DeepSeek Harness 桌面客户端（Electron）。
    以玲珑包分发 Electron Desktop 客户端；自本版起取代 Go + Wails 薄壳版。

command:
  - /opt/apps/com.deepseek.dsh-desktop/files/bin/dsh-desktop

base: org.deepin.base/25.2.2

# 组装式构建：重工具链（pnpm/tsc/tsdown/electron-builder/Electron 下载）全部在宿主机跑，
# 先在仓库根运行 sh apps/linyaps/desktop-linglong/prepare-offline.sh 生成 stage/ 产物，
# 本段只在容器内复制组装。
#
# 与薄壳版的关键差异：Electron Desktop 自带 Electron 运行时与 dsh 树
# （resources/app.asar/dsh），因此本包**不再随包 Node 与 harness 树**——那是薄壳版
# 体积的主要来源，Electron 版不需要第二份。
build: |
  STAGE=/project/apps/linyaps/desktop-linglong/stage
  if [ ! -d "$STAGE" ]; then
    echo "stage 缺失：先在仓库根运行 sh apps/linyaps/desktop-linglong/prepare-offline.sh" >&2
    exit 1
  fi

  mkdir -p ${PREFIX}/bin ${PREFIX}/electron
  cp -a "$STAGE/." ${PREFIX}/electron/

  # Electron 主程序名由 electron-builder 依 productName/name 生成（上游改名时不该
  # 连带改这里）：在暂存目录顶层找唯一的可执行 ELF，排除 chrome-sandbox（它需要
  # setuid，而玲珑禁止提权，用不了）与共享库。
  MAIN_EXE=
  for candidate in "$STAGE"/*; do
    [ -f "$candidate" ] || continue
    [ -x "$candidate" ] || continue
    case "$candidate" in
      */chrome-sandbox|*.so|*.so.*) continue ;;
    esac
    MAIN_EXE=$(basename "$candidate")
    break
  done
  if [ -z "$MAIN_EXE" ]; then
    echo "未在暂存目录找到 Electron 主程序" >&2
    exit 1
  fi
  echo "Electron 主程序: $MAIN_EXE"

  # 启动包装：玲珑容器内 SUID 不可用，Chromium 沙箱无法工作，必须 --no-sandbox
  # （玲珑化的 Electron 应用通行做法）。用绝对路径解析自身，避免依赖调用方 cwd。
  printf '%s\n' \
    '#!/bin/sh' \
    'SELF=$(readlink -f "$0" 2>/dev/null || echo "$0")' \
    'DIR=$(dirname "$SELF")' \
    "exec \"\$DIR/../electron/$MAIN_EXE\" --no-sandbox \"\$@\"" \
    > ${PREFIX}/bin/dsh-desktop
  chmod +x ${PREFIX}/bin/dsh-desktop

  # CLI 包装：桌面应用内的 dsh 命令。$PREFIX/bin 在容器 PATH 首位，因此托盘
  # 「终端」与应用内的终端都能直接执行它；CLI 复用随包的 Electron 运行时
  # （ELECTRON_RUN_AS_NODE 以纯 Node 方式运行，不创建窗口），不要求宿主另装
  # Node，也不需要 electron-builder 产出的 MacOS 专用 cli/bin/dsh 脚本。
  printf '%s\n' \
    '#!/bin/sh' \
    'SELF=$(readlink -f "$0" 2>/dev/null || echo "$0")' \
    'DIR=$(dirname "$SELF")' \
    'RES="$DIR/../electron/resources"' \
    "ELECTRON_RUN_AS_NODE=1 exec \"\$DIR/../electron/$MAIN_EXE\" --expose-internals \"\$RES/app.asar/dsh/node_modules/@deepseek-ai/dsh-desktop-host/lib/cli.js\" \"\$@\"" \
    > ${PREFIX}/bin/dsh
  chmod +x ${PREFIX}/bin/dsh

  for s in 16 22 24 32 48 64 128 256 512; do
    install -Dm644 /project/apps/linyaps/desktop-linglong/icons/hicolor/${s}x${s}/apps/dsh-desktop.png \
      ${PREFIX}/share/icons/hicolor/${s}x${s}/apps/dsh-desktop.png
  done

  install -Dm644 /project/apps/linyaps/desktop-linglong/com.deepseek.dsh-desktop.desktop \
    ${PREFIX}/share/applications/com.deepseek.dsh-desktop.desktop

  # git 的 init 模板（hooks/*.sample、description、info/exclude）：随包的 git 按
  # 编译期路径 /usr/share/git-core/templates 去找，容器里没有，于是每次 init 都打
  # 「templates not found」告警，新仓库也没有示例钩子。
  #
  # 从 .deb 里自行解出而不是复制构建容器的 /usr：apt 装进来的实体在 /usr 下，而
  # /usr 不随 layer 导出，复制过去要么拿不到、要么拿到字符设备（薄壳版 AUDIT N19
  # 记录过同一现象）。apt-get download + dpkg-deb -x 得到的是普通文件，两条路都绕开。
  # git 已在 buildext.apt.depends 里，此处只取它的数据文件。
  GIT_TMP=$(mktemp -d)
  ( cd "$GIT_TMP" && apt-get download git ) \
    || { echo "git templates: apt-get download git 失败" >&2; exit 1; }
  set -- "$GIT_TMP"/git_*.deb
  [ "$#" -eq 1 ] && [ -f "$1" ] || { echo "git templates: .deb 未唯一命中（$# 个：$*）" >&2; exit 1; }
  dpkg-deb -x "$1" "$GIT_TMP/x"
  GIT_TEMPLATES="$GIT_TMP/x/usr/share/git-core/templates"
  [ -d "$GIT_TEMPLATES" ] || { echo "git templates: 解包后没有 $GIT_TEMPLATES（包布局变化？）" >&2; exit 1; }
  mkdir -p ${PREFIX}/share/git-core
  cp -a "$GIT_TEMPLATES" ${PREFIX}/share/git-core/
  echo "git templates: 交付 $(find ${PREFIX}/share/git-core/templates -type f | wc -l) 个文件"

buildext:
  apt:
    build_depends: []
    # 说明：这里的 depends 在 build 段之后才装进容器，且 /usr 不随 layer 导出
    # （薄壳版在 webkit 上实测过同一现象）。因此下面这些库只保证**构建期**可解析，
    # 运行期依赖基础层 org.deepin.base 提供；实测若缺库，需按薄壳版 webkit 的做法
    # 用 apt-get download + dpkg-deb -x 显式搬进 ${PREFIX}。
    #
    # 交付情况由 linglong/verify-merged-deps.sh 在合并产物树上逐个断言；新增依赖
    # 必须同时在那个脚本的规则表里认领，否则校验直接失败。
    depends:
      # --- Chromium 运行库（Electron 自带 Chromium，与薄壳版的 WebKit 无关）---
      - libgtk-3-0
      - libnss3
      - libgbm1
      - libasound2
      - libatk-bridge2.0-0
      - libatspi2.0-0
      - libcups2
      - libxkbcommon0
      - libxcomposite1
      - libxdamage1
      - libxrandr2
      - libdrm2
      - libpango-1.0-0
      - libcairo2
      - libxshmfence1
      # --- 通用工具链 ---
      # 容器内没有 git，而 harness 自己就要用它：workspace-changes 用 git 算工作区
      # 变更，worktree 插件的 gitCommand 也指向它。随包合并进 ${PREFIX}/bin（容器
      # PATH 首位），模型与 harness 都能直接调用。
      - git
      # 带 LFS 配置的仓库在 checkout/push 时由 post-checkout/pre-push 钩子调用
      # git-lfs；不随包则钩子报错、推送需 --no-verify 绕过，等于大文件没被正确上传。
      - git-lfs
      - python3
      - curl
      - wget
      - unzip
      - zip
      - jq
      - xxd   # 独立二进制包；beige/noble 的 vim-common 已不含 xxd
      - ca-certificates   # git/https/python 校验
      # 打开外部链接需要真实的 xdg-open：基础运行时的 /usr/bin/xdg-open 只是个
      # systemd-run 转发壳（实测递归失败，打不开任何东西）。Electron 的
      # shell.openExternal 走同一个入口，不替换则外链与登录页都打不开。合并后
      # ${PREFIX}/bin 在容器 PATH 首位，盖过该壳。
      - xdg-utils
      # 粘贴图片：Electron 的 clipboardImageRead 读的是 Wayland 剪贴板，实测
      # XWayland 不把 Wayland 侧的 image/png 暴露成 X11 selection。缺 wl-paste
      # 时截图粘贴静默失效。
      - wl-clipboard
