<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DSH · Wails v3 spike</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <!-- 自绘标题栏：无边框窗口的可拖拽区域由 --wails-draggable 决定。
         这一行是客户端现有实现的原样保留，用来验证 v3 仍然认这个 CSS 属性。 -->
    <header id="titlebar" data-testid="titlebar">
      <span class="brand">DeepSeek Harness · Wails v3 spike</span>
      <div class="actions">
        <button id="btn-min" title="最小化">—</button>
        <button id="btn-max" title="最大化/还原">▢</button>
        <button id="btn-close" title="关闭">×</button>
      </div>
    </header>

    <main>
      <h1>验证结果</h1>
      <p class="hint">
        拖拽标题栏移动窗口；标题栏按钮走 Wails runtime。所有事实会写入 Go 侧报告文件，路径见下方。
      </p>
      <p><button id="btn-mic">请求麦克风</button> <span id="mic-result"></span></p>
      <table id="facts"><tbody></tbody></table>
      <p id="report-path" class="path"></p>
    </main>

    <!-- 入口是引导模块：它先装 v2 全局适配层，再加载壳脚本（app.js 保持 v2 写法）。
         迁移时 index.html 只需要把原来的一行 <script src="./app.js"> 换成这里。 -->
    <script type="module" src="./boot.js"></script>
  </body>
</html>
