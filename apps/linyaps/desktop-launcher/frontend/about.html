<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DeepSeek Harness</title>
<link rel="stylesheet" href="styles.css">
</head>
<body class="about-window">
<!-- 独立「关于」窗口：布局与 desktop-dual 的 GTK 助手一致（logo、居中版本、形态徽标、
     包 ID + 一键复制、字段网格 + 可点仓库）。窗口自带系统标题栏与关闭按钮，页面内
     不再重复标题行；数据由 about.js 经 AboutData 方法拉取。 -->
<main class="modal-card modal-about">
  <div class="modal-body about-body">
    <img class="about-logo" src="logo.png" width="72" height="72" alt="" data-i18n-alt="about.logoAlt">
    <div id="about-name" class="about-name"></div>
    <div id="about-version" class="about-version selectable"></div>
    <div id="about-form" class="about-form"></div>
    <div class="about-id-row">
      <span id="about-package-id" class="about-id mono selectable"></span>
      <button id="about-copy" class="icon-btn-sm" data-i18n-title="about.copyPackageId" data-i18n-aria-label="about.copyPackageId">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
      </button>
    </div>
    <div class="about-fields">
      <div class="about-row"><span class="about-key" data-i18n="about.harnessVersion"></span><span id="about-harness-version" class="about-value"></span></div>
      <div class="about-row"><span class="about-key" data-i18n="about.upstream"></span><a id="about-upstream" class="about-link" href="#"></a></div>
      <div class="about-row"><span class="about-key" data-i18n="about.packager"></span><span id="about-packager" class="about-value"></span></div>
      <div class="about-row"><span class="about-key" data-i18n="about.fork"></span><a id="about-fork" class="about-link" href="#"></a></div>
    </div>
    <div id="about-error" class="error hidden" data-i18n="about.loadFailed"></div>
  </div>
</main>

<!-- 国际化：字典先挂到全局，i18n.js 再据此建立门面；about.js 是模块脚本，天然
     在普通脚本之后执行，因此能直接使用 window.DSHI18N。顺序不可调换。 -->
<script src="locales/zh.js"></script>
<script src="locales/en.js"></script>
<script src="i18n.js"></script>
<script type="module" src="about.js"></script>
</body>
</html>
