<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self'; script-src 'self'; img-src 'self'; base-uri 'none'; form-action 'none'">
<title>工具链市场</title>
<!-- 设计令牌来自 design-platform.css：页面自己的样式表只引用 --dsw-alias-*，
     不定义它们。少了这一行，所有颜色与边框都会因为变量未定义而失效，
     而布局（硬编码尺寸）仍然正常，看起来就像「界面只丢了一半样式」。 -->
<link rel="stylesheet" href="design-platform.css">
<link rel="stylesheet" href="toolchain.css">
</head>
<body>
<!-- 工具栏：搜索与刷新。分类页签在下面单独一行，因为它会随索引变化增删，
     和固定控件放在一起会让布局在加载后跳动。 -->
<header id="toolbar">
  <input id="search" type="search" autocomplete="off" spellcheck="false">
  <button id="refresh" class="btn btn-quiet" type="button"></button>
</header>
<nav id="categories" aria-label=""></nav>
<p id="notice" hidden></p>
<main id="grid"></main>
<!-- 空状态与网格互斥：列表为空时显示引导，而不是一片空白。 -->
<main id="empty" hidden></main>
<footer id="summary" role="status"></footer>
<!-- 内置清单：随包工具不参与市场，因此不占卡片网格，从这里按需展开。 -->
<div id="bundled-panel" role="dialog" aria-modal="false" hidden>
  <div class="bundled-head">
    <span id="bundled-heading"></span>
    <button id="bundled-close" class="btn btn-quiet" type="button" aria-label=""></button>
  </div>
  <p id="bundled-hint"></p>
  <ul id="bundled-list"></ul>
</div>
<script src="shell-theme.js"></script>
<script src="toolchain.js"></script>
</body>
</html>
