# 容器内工具清单:verify-tools.sh 逐项校验;installable 为按需安装白名单
# 格式契约(解析器基于本文件,勿引入 YAML 全特性):
#   tools 下每项: 2 空格缩进的 name: 段,其下 binary:/verify:/shim:/base: 均 4 空格缩进
#   base: true 表示该工具由基础运行时 org.deepin.base 提供(运行时实测 /bin/python3、
#   /bin/curl、/bin/unzip);buildext.apt.depends 只合并"新装差异"包,基础镜像已有的
#   不会进 $PREFIX,故 verify-tools.sh 对 base 项不做 $PREFIX 存在性校验,只在运行时确认。
tools:
  git:
    binary: bin/git
    verify: git --version
  git-lfs:
    binary: bin/git-lfs
    verify: git lfs version
  python3:
    binary: bin/python3
    verify: python3 --version
    base: true
  curl:
    binary: bin/curl
    verify: curl --version
    base: true
  wget:
    binary: bin/wget
    verify: wget --version
  jq:
    binary: bin/jq
    verify: jq --version
  unzip:
    binary: bin/unzip
    base: true
  xxd:
    binary: bin/xxd
  node:
    binary: bin/node
    verify: node --version
  pnpm:
    shim: true
    verify: pnpm --version
  dsh:
    binary: bin/dsh
    verify: dsh --version
# 按需安装白名单:运行时实际生效的清单在 launcher 的 internal/toolchain/catalog.go
# （校验 sha256 后原子安装到 $HOME/.dsh-tools）；本段与其保持同步，供打包文档
# 与 verify-tools.sh 校验（sha256 含 "<" 占位符即失败）。
installable:
  jdk21:
    version: "21.0.12.1"
    url: "https://github.com/adoptium/temurin21-binaries/releases/download/jdk-21.0.12.1%2B1/OpenJDK21U-jdk_x64_linux_hotspot_21.0.12.1_1.tar.gz"
    sha256: "ce79869e1307ed8ee1e2baa86a412b1eb5b75d10a01006d788a6f968bcfaee94"
  go:
    version: "1.23.2"
    url: "https://go.dev/dl/go1.23.2.linux-amd64.tar.gz"
    sha256: "542d3c1705f1c6a1c5a80d5dc62e2e45171af291e755d591c5e6531ef63b454e"
  ripgrep:
    version: "14.1.0"
    url: "https://github.com/BurntSushi/ripgrep/releases/download/14.1.0/ripgrep-14.1.0-x86_64-unknown-linux-musl.tar.gz"
    sha256: "f84757b07f425fe5cf11d87df6644691c644a5cd2348a2c670894272999d3ba7"
# 有意不包含(包体控制):编译器链不进包体、不进按需白名单
excluded:
  - gcc
  - clang
  - rustc
