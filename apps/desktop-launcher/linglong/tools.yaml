# 容器内工具清单:verify-tools.sh 逐项校验;installable 为按需安装白名单
# 格式契约(解析器基于本文件,勿引入 YAML 全特性):
#   tools 下每项: 2 空格缩进的 name: 段,其下 binary:/verify:/shim:/base: 均 4 空格缩进
#   base: true 表示该工具由基础运行时 org.deepin.base 提供(运行时实测 /bin/python3、
#   /bin/curl、/bin/unzip);buildext.apt.depends 只合并"新装差异"包,基础镜像已有的
#   不会进 $PREFIX,故 verify-tools.sh 对 base 项不做 $PREFIX 存在性校验,只在运行时确认。
tools:
  git:
    binary: bin/git
    verify: git --version
  git-lfs:
    binary: bin/git-lfs
    verify: git lfs version
  python3:
    binary: bin/python3
    verify: python3 --version
    base: true
  curl:
    binary: bin/curl
    verify: curl --version
    base: true
  wget:
    binary: bin/wget
    verify: wget --version
  jq:
    binary: bin/jq
    verify: jq --version
  unzip:
    binary: bin/unzip
    base: true
  xxd:
    binary: bin/xxd
  node:
    binary: bin/node
    verify: node --version
  pnpm:
    shim: true
    verify: pnpm --version
  dsh:
    binary: bin/dsh
    verify: dsh --version
  xdg-open:
    binary: bin/xdg-open
    # 无 verify：任何安全的调用要么无意义要么必然报错，而真实调用会打开浏览器
    #（经宿主 portal）。随包目标是真实 xdg-utils，盖过基础运行时失败的转发壳。
# 按需安装白名单:运行时实际生效的清单在 launcher 的
# internal/toolchain/tools/index.json（校验 sha256 后原子安装到
# $HOME/.dsh-tools）；本段与其保持同步，供打包文档与 verify-tools.sh 校验
# （sha256 含 "<" 占位符即失败）。
