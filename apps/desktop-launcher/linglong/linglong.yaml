version: "1"
package:
  id: com.deepseek.dsh-desktop
  name: deepseek-harness-desktop
  version: 0.1.0.17
  kind: app
  description: |
    DeepSeek Harness 桌面客户端。
    以受监护子进程方式运行 harness，通过系统 webkit2gtk 窗口加载其 Web GUI。

command:
  - /opt/apps/com.deepseek.dsh-desktop/files/bin/dsh-desktop-launcher

base: org.deepin.base/25.2.2

# 组装式构建：重工具链（pnpm/tsc/tsdown/go）全部在宿主机跑，
# 先在仓库根运行 sh apps/desktop-launcher/linglong/prepare-offline.sh
# 生成 stage/ 产物，本脚本只在容器内复制组装。
# 源码改动后需重新运行 prepare-offline.sh。
build: |
  STAGE=/project/apps/desktop-launcher/linglong/stage
  if [ ! -x "$STAGE/bin/dsh-desktop-launcher" ]; then
    echo "stage 缺失：先在仓库根运行 sh apps/desktop-launcher/linglong/prepare-offline.sh" >&2
    exit 1
  fi
  # harness 运行时需要 Node >=24（node:zlib.createZstdDecompress、
  # Promise.withResolvers、node:module.stripTypeScriptTypes），
  # beige 的 nodejs 只有 20.15.1，必须捆绑 Node 24。
  # 复用宿主机 prepare 阶段下载的 Node 24 二进制（npmmirror 镜像）。
  if [ ! -d "$STAGE/node" ]; then
    unset http_proxy https_proxy HTTP_PROXY HTTPS_PROXY all_proxy ALL_PROXY
    wget -q -O /tmp/node24.tar.gz https://registry.npmmirror.com/-/binary/node/v24.9.0/node-v24.9.0-linux-x64.tar.gz
    mkdir -p "$STAGE/node"
    tar -xzf /tmp/node24.tar.gz -C "$STAGE/node" --strip-components=1
  fi
  mkdir -p ${PREFIX}/bin ${PREFIX}/harness ${PREFIX}/node
  cp -a "$STAGE/harness/." ${PREFIX}/harness/
  # 容器工具清单注入:overlay 覆盖 standard 预设的 persona 文本(追加容器工具链
  # 段),使打包会话的模型可见输入带上可用工具清单。cp 只覆盖同名文件,其余预设保留。
  cp -a /project/apps/desktop-launcher/linglong/harness-overlay/config/agent-presets/. \
        ${PREFIX}/harness/config/agent-presets/
  cp -a "$STAGE/node/." ${PREFIX}/node/
  # node/pnpm 上 PATH:玲珑只自动把 $PREFIX/bin 加进容器 PATH($PREFIX/node/bin 不在)。
  # harness 自身经 $PREFIX/node/bin/node 绝对路径启动,但模型 bash 工具需要 PATH 上的
  # node/corepack(pnpm);软链进 $PREFIX/bin 后容器内任何进程都能直接调用。
  ln -sf ../node/bin/node ${PREFIX}/bin/node
  ln -sf ../node/bin/corepack ${PREFIX}/bin/corepack
  ln -sf ../node/bin/npm ${PREFIX}/bin/npm
  ln -sf ../node/bin/npx ${PREFIX}/bin/npx
  install -m755 "$STAGE/bin/dsh-desktop-launcher" ${PREFIX}/bin/dsh-desktop-launcher
  install -Dm644 /project/apps/desktop-launcher/icons/dsh-desktop.png ${PREFIX}/share/icons/hicolor/256x256/apps/dsh-desktop.png
  # 桌面集成：.desktop 文件（generateEntries 会复制到 entries/share/applications，
  # 玲珑启动器/应用菜单据此显示程序与图标）
  install -Dm644 /project/apps/desktop-launcher/linglong/com.deepseek.dsh-desktop.desktop ${PREFIX}/share/applications/com.deepseek.dsh-desktop.desktop
  # 字节补丁 webkit helper 路径：Debian 正式构建把 helper 目录硬编码为
  # /usr/lib/x86_64-linux-gnu/webkit2gtk-4.1（WEBKIT_EXEC_PATH 需 DEVELOPER_MODE
  # 才有效，运行时 /usr 只读、layer 不导出 /usr）。替换为 /tmp/dsh-webkit-4.1，
  # launcher 启动时建符号链接指向 ${PREFIX} 下的真实 helper。
  #
  # 关键：buildext.apt.depends 的 webkit 在构建后（preCommit）才合并进
  # $PREFIX，若等那时再补丁为时已晚。因此这里直接从 build 容器 /usr
  # （build_depends 已装 libwebkit2gtk-4.1-0）复制并打补丁；preCommit 的
  # mergeOutput 用 skip_existing 不会覆盖我们预置的补丁版。
  mkdir -p ${PREFIX}/lib/x86_64-linux-gnu
  cp -a /usr/lib/x86_64-linux-gnu/libwebkit2gtk-4.1.so.0.19.7 ${PREFIX}/lib/x86_64-linux-gnu/
  sh /project/apps/desktop-launcher/linglong/patch-webkit-exec-path.sh ${PREFIX}/lib/x86_64-linux-gnu/libwebkit2gtk-4.1.so.0.19.7
  ln -sf libwebkit2gtk-4.1.so.0.19.7 ${PREFIX}/lib/x86_64-linux-gnu/libwebkit2gtk-4.1.so.0
  ln -sf libwebkit2gtk-4.1.so.0 ${PREFIX}/lib/x86_64-linux-gnu/libwebkit2gtk-4.1.so

buildext:
  apt:
    build_depends:
      - libwebkit2gtk-4.1-0
    depends:
      - libwebkit2gtk-4.1-0
      - libjavascriptcoregtk-4.1-0
      - libgtk-3-0
      - libglib2.0-0
      # harness 容器化运行（bash 工具链在胶囊内执行），仓库 git 操作经 `git`
      # 完成；基础运行时不含 git，必须随包带入。buildext 会把 git 及其依赖
      # 合并进 ${PREFIX}（/usr/bin → ${PREFIX}/bin，已在容器 PATH 上；
      # /usr/lib → ${PREFIX}/lib，已进 ld 搜索目录）。
      - git
      # 层1 工具链自包含:随包工具与其运行时依赖
      - python3
      - python3-pip
      - curl
      - wget
      - unzip
      - zip
      - jq
      - xxd   # 独立二进制包;beige/noble 的 vim-common 已不含 xxd
      - ca-certificates   # git/https/python 校验
