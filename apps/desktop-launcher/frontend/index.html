<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DeepSeek Harness</title>
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="vendor/xterm.css">
</head>
<body>
<div id="app">
  <!-- 自定义标题栏（合并原工具条）：左品牌，右动作图标 + 窗口控制 -->
  <header id="titlebar">
    <div class="titlebar-brand">
      <span class="brand-mark">
        <svg width="20" height="20" viewBox="0 0 50 50" fill="none" aria-hidden="true"><path id="dsh-whale" d="M48.8354 10.0479C48.3232 9.79199 48.1025 10.2798 47.8032 10.5278C47.7007 10.6079 47.6143 10.7119 47.5273 10.8076C46.7793 11.624 45.9048 12.1597 44.7622 12.0957C43.0923 12 41.666 12.5356 40.4058 13.8398C40.1377 12.2319 39.2476 11.272 37.8926 10.6558C37.1836 10.3359 36.4668 10.0156 35.9702 9.31982C35.6235 8.82373 35.5293 8.27197 35.356 7.72754C35.2456 7.3999 35.1353 7.06396 34.7651 7.00781C34.3633 6.94385 34.2056 7.2876 34.0479 7.57568C33.418 8.75195 33.1733 10.0479 33.1973 11.3599C33.2524 14.312 34.4736 16.6641 36.8999 18.3359C37.1758 18.5278 37.2466 18.7197 37.1597 19C36.9946 19.5757 36.7974 20.1357 36.624 20.7119C36.5137 21.0801 36.3486 21.1597 35.9624 21C34.6309 20.4321 33.481 19.5918 32.4644 18.5757C30.7393 16.8721 29.1792 14.9917 27.2334 13.52C26.7764 13.1758 26.3193 12.856 25.8467 12.5518C23.8618 10.584 26.1069 8.96777 26.627 8.77588C27.1704 8.57568 26.8159 7.8877 25.0591 7.896C23.3022 7.90381 21.6953 8.50391 19.647 9.30371C19.3477 9.42383 19.0322 9.51172 18.7095 9.58398C16.8501 9.22363 14.9199 9.14355 12.9033 9.37598C9.10596 9.80762 6.07275 11.6396 3.84326 14.7681C1.16455 18.5278 0.53418 22.7998 1.30664 27.2559C2.11768 31.9521 4.46582 35.8398 8.07373 38.8799C11.8159 42.0322 16.1255 43.5762 21.041 43.2803C24.0269 43.104 27.3516 42.6963 31.1016 39.4561C32.0469 39.936 33.0396 40.1279 34.686 40.272C35.9546 40.3921 37.1758 40.208 38.1211 40.0078C39.6021 39.688 39.4995 38.2881 38.9639 38.0322C34.623 35.9678 35.5762 36.8081 34.71 36.1279C36.9155 33.4639 40.2402 30.6958 41.54 21.728C41.6426 21.0161 41.5557 20.5679 41.54 19.9917C41.5322 19.6396 41.6108 19.5039 42.0049 19.4639C43.0923 19.3359 44.1479 19.0317 45.1167 18.4878C47.9292 16.9199 49.064 14.3438 49.3315 11.2559C49.3711 10.7837 49.3237 10.2959 48.8354 10.0479ZM24.3262 37.8398C20.1196 34.4639 18.0791 33.3521 17.2358 33.3999C16.4482 33.4482 16.5898 34.3682 16.7632 34.9678C16.9443 35.5601 17.1812 35.9683 17.5117 36.4878C17.7402 36.832 17.8979 37.3442 17.2832 37.728C15.9282 38.584 13.5728 37.4399 13.4624 37.3838C10.7207 35.7358 8.42822 33.5601 6.81348 30.584C5.25342 27.7197 4.34766 24.6479 4.19775 21.3677C4.1582 20.5757 4.38672 20.2959 5.15869 20.1519C6.17529 19.96 7.22314 19.9199 8.23926 20.0718C12.5327 20.7119 16.1885 22.6719 19.2529 25.7759C21.002 27.5439 22.3252 29.6558 23.6885 31.7202C25.1377 33.9121 26.6978 36 28.6831 37.7119C29.3843 38.312 29.9434 38.7681 30.479 39.104C28.8643 39.2881 26.1699 39.3281 24.3262 37.8398ZM26.3433 24.6001C26.3433 24.248 26.6191 23.9678 26.9658 23.9678C27.0444 23.9678 27.1152 23.9839 27.1782 24.0078C27.2651 24.04 27.3438 24.0879 27.4067 24.1602C27.5171 24.272 27.5801 24.4321 27.5801 24.6001C27.5801 24.9521 27.3042 25.2319 26.9575 25.2319C26.6108 25.2319 26.3433 24.9521 26.3433 24.6001ZM32.6064 27.8799C32.2046 28.0479 31.8027 28.1919 31.4165 28.208C30.8179 28.2397 30.1641 27.9922 29.8096 27.688C29.2583 27.2158 28.8643 26.9521 28.6987 26.1279C28.6279 25.7759 28.6675 25.2319 28.7305 24.9199C28.8721 24.248 28.7144 23.8159 28.2495 23.4238C27.8716 23.104 27.3911 23.0161 26.8633 23.0161C26.666 23.0161 26.4849 22.9277 26.3511 22.856C26.1304 22.7441 25.9492 22.4639 26.1226 22.1201C26.1777 22.0078 26.4458 21.7358 26.5088 21.688C27.2256 21.272 28.0527 21.4077 28.8169 21.7197C29.5259 22.0161 30.0615 22.5601 30.834 23.3281C31.6216 24.2559 31.7632 24.5117 32.2124 25.208C32.5669 25.752 32.8901 26.312 33.1104 26.9521C33.2446 27.3521 33.0713 27.6802 32.6064 27.8799Z" fill="currentColor"/></svg>
      </span>
      <span class="brand-name">DeepSeek Harness</span>
    </div>
    <div class="titlebar-actions">
      <button id="btn-server" class="icon-btn" data-i18n-title="titlebar.server">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3"><rect x="2" y="2.5" width="12" height="4.5" rx="1"/><rect x="2" y="9" width="12" height="4.5" rx="1"/><circle cx="4.5" cy="4.75" r="0.7" fill="currentColor"/><circle cx="4.5" cy="11.25" r="0.7" fill="currentColor"/></svg>
      </button>
      <button id="btn-tools" class="icon-btn" data-i18n-title="titlebar.tools">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg>
        <span id="tools-update-badge" class="icon-badge hidden"></span>
      </button>
      <button id="btn-terminal" class="icon-btn" data-i18n-title="titlebar.terminal">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 17 10 11 4 5"/><line x1="12" y1="19" x2="20" y2="19"/></svg>
      </button>
      <button id="btn-doctor" class="icon-btn doctor-icon" data-i18n-title="titlebar.doctor">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="M12 8v6"/><path d="M9 11h6"/></svg>
      </button>
      <button id="btn-about" class="icon-btn" data-i18n-title="titlebar.about">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3"><circle cx="8" cy="8" r="6.3"/><path d="M8 7.3v3.4M8 4.8v.2"/></svg>
      </button>
    </div>
    <!-- 动作组与窗口控制组之间的分组线：纯装饰，不进无障碍树 -->
    <div class="titlebar-divider" aria-hidden="true"></div>
    <div class="titlebar-window">
      <button id="win-min" class="win-btn" data-i18n-title="titlebar.minimize">
        <svg width="14" height="14" viewBox="0 0 16 16" stroke="currentColor" stroke-width="1.2"><path d="M2.5 8h11"/></svg>
      </button>
      <button id="win-max" class="win-btn" data-i18n-title="titlebar.maximize">
        <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.2"><rect x="3" y="3" width="10" height="10" rx="1"/></svg>
      </button>
      <button id="win-close" class="win-btn win-close" data-i18n-title="titlebar.close">
        <svg width="14" height="14" viewBox="0 0 16 16" stroke="currentColor" stroke-width="1.2"><path d="M3.5 3.5l9 9M12.5 3.5l-9 9"/></svg>
      </button>
    </div>
  </header>

  <!-- 主舞台：圆角卡片包住 harness iframe / 引导页 -->
  <main id="stage">
    <div id="stage-card">
      <iframe id="harness" class="hidden" allowfullscreen></iframe>

      <section id="guidance" class="cards">
      <div class="card-wide">
        <h1>DeepSeek Harness</h1>
        <p class="intro" data-i18n="guidance.intro"></p>
      </div>
      <div class="card">
        <h2 data-i18n="guidance.container.title"></h2>
        <ol>
          <li data-i18n="guidance.step.openServer"></li>
          <li data-i18n="guidance.container.keepMode"></li>
          <li data-i18n="guidance.container.start"></li>
        </ol>
      </div>
      <div class="card">
        <h2 data-i18n="guidance.remote.title"></h2>
        <ol>
          <li data-i18n="guidance.step.openServer"></li>
          <li data-i18n="guidance.remote.switchMode"></li>
          <li data-i18n="guidance.remote.fillAddress"></li>
        </ol>
        <p class="hint"><span data-i18n="guidance.remote.hint.before"></span> <code>dsh web --host &lt;LAN-IP&gt;</code> <span data-i18n="guidance.remote.hint.after"></span></p>
      </div>
      <div class="card-wide">
        <h2 data-i18n="guidance.npx.title"></h2>
        <ol>
          <li><span data-i18n="guidance.npx.step1.before"></span> <code>npx @deepseek-ai/dsh web</code> <span data-i18n="guidance.npx.step1.after"></span></li>
          <li><span data-i18n="guidance.npx.step2.before"></span> <code>http://127.0.0.1:3456</code><span data-i18n="guidance.npx.step2.after"></span></li>
          <li data-i18n="guidance.npx.step3"></li>
        </ol>
        <p class="hint"><span data-i18n="guidance.npx.hint.before"></span> <code>--host &lt;LAN-IP&gt;</code> <span data-i18n="guidance.npx.hint.after"></span></p>
      </div>
    </section>

      <!-- 启动加载页 -->
      <section id="loading-page" class="loading-page hidden">
        <div class="loading-spinner" aria-hidden="true"></div>
        <h2 data-i18n="loading.title"></h2>
        <p id="loading-hint" class="loading-hint" data-i18n="loading.hint"></p>
        <!-- 真实进度：harness 侧注入的上报插件逐条上报已激活条目数（见
             internal/appenv/startup_progress.mjs）。没有上报时整块隐藏，
             页面退回上面的转圈与静态文案，不出现按时间猜的假进度。 -->
        <div id="loading-progress" class="loading-progress hidden">
          <div id="loading-track" class="loading-track" role="progressbar" aria-labelledby="loading-progress-text">
            <div id="loading-bar" class="loading-bar"></div>
          </div>
          <p id="loading-progress-text" class="loading-hint"></p>
        </div>
      </section>

      <!-- 启动前预检页：预检进行中 / 发现问题等待决策 / 修复穷尽降级建议 -->
      <section id="preflight-page" class="preflight-page hidden">
        <div id="preflight-icon" class="preflight-icon" aria-hidden="true">🩺</div>
        <h2 id="preflight-title" data-i18n="preflight.title"></h2>
        <p id="preflight-hint" class="preflight-hint" data-i18n="preflight.checking"></p>
        <div id="preflight-repairs" class="preflight-repairs hidden"></div>
        <div id="preflight-issues" class="preflight-issues hidden"></div>
        <div id="preflight-actions" class="failed-actions hidden">
          <button id="btn-preflight-deep-repair" class="btn btn-primary" data-i18n="preflight.deepRepair"></button>
          <button id="btn-preflight-safe-mode" class="btn" data-i18n="preflight.safeMode"></button>
          <button id="btn-preflight-fresh" class="btn" data-i18n="preflight.freshHome"></button>
          <button id="btn-preflight-skip" class="btn btn-link" data-i18n="preflight.skip"></button>
        </div>
        <p id="preflight-note" class="preflight-note hidden"></p>
      </section>

      <!-- 启动失败页 -->
      <section id="failed-page" class="failed-page hidden">
        <div class="failed-icon" aria-hidden="true">⚠️</div>
        <h2 data-i18n="failed.title"></h2>
        <div id="failed-reason" class="failed-reason"></div>
        <div class="failed-actions">
          <button id="btn-failed-doctor" class="btn btn-primary" data-i18n="failed.diagnose"></button>
          <button id="btn-failed-safe-mode" class="btn" data-i18n="failed.safeMode"></button>
        </div>
        <p class="failed-log-hint"><span data-i18n="failed.logHint"></span> ~/.cache/dsh-desktop/harness.log</p>
      </section>
    </div>
  </main>

  <!-- 底部状态栏 -->
  <footer id="statusbar">
    <span id="status-dot" class="dot muted"></span>
    <span id="status-text" data-i18n="status.starting"></span>
  </footer>
</div>

<!-- 服务器弹框 -->
<div id="server-modal" class="modal hidden">
  <div class="modal-card modal-server">
    <div class="modal-head">
      <span class="modal-title"><span class="brand-dot"></span><span data-i18n="server.title"></span></span>
      <button class="modal-close" data-close="server-modal">×</button>
    </div>
    <div class="modal-body modal-body-stack">
      <!-- 连接模式：radio 仍是状态源，label 内的 span 只做分段控件外观 -->
      <div class="mode-row">
        <span class="key" data-i18n="server.mode.label"></span>
        <div class="mode-switch" role="radiogroup" data-i18n-aria-label="server.mode.label">
          <label class="mode-opt"><input type="radio" name="mode" value="container" checked><span data-i18n="server.mode.container"></span></label>
          <label class="mode-opt"><input type="radio" name="mode" value="external"><span data-i18n="server.mode.external"></span></label>
        </div>
      </div>

      <div id="container-panel" class="section">
        <div class="row"><span class="key" data-i18n="server.state.label"></span><span id="server-state" class="row-value state-value state-muted">…</span></div>
        <div class="row row-address"><span class="key" data-i18n="server.address.label"></span><span class="stack"><span id="server-detail1" class="selectable row-value"></span><span id="server-address" class="selectable row-value mono code addr hidden"><span id="server-addr-origin" class="addr-origin"></span><span id="server-addr-token" class="addr-token"></span></span></span><button id="server-copy" class="icon-btn-sm hidden" data-i18n-title="server.copyAddress"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg></button></div>
        <div class="row"><span class="key">PID</span><span id="server-detail2" class="selectable row-value mono"></span></div>
        <div class="actions actions-bar">
          <button id="server-start" class="btn btn-primary" data-i18n="server.start"></button>
          <button id="server-restart" class="btn" data-i18n="server.restart"></button>
          <button id="server-stop" class="btn btn-danger" data-i18n="server.stop"></button>
        </div>
        <div id="safe-mode-row" class="safe-mode-row hidden">
          <button id="btn-safe-mode" class="btn"><span aria-hidden="true">🔒</span> <span data-i18n="server.safeMode.start"></span></button>
          <p class="hint" data-i18n="server.safeMode.hint"></p>
        </div>
        <div id="safe-mode-active" class="safe-mode-active hidden">
          <span class="badge-safe"><span aria-hidden="true">🔒</span> <span data-i18n="server.safeMode.active"></span></span>
          <button id="btn-exit-safe-mode" class="btn btn-link" data-i18n="server.safeMode.exit"></button>
        </div>
        <div id="fresh-home-active" class="safe-mode-active hidden">
          <span class="badge-safe"><span aria-hidden="true">🆕</span> <span data-i18n="server.freshHome.active"></span></span>
          <button id="btn-exit-fresh-home" class="btn btn-link" data-i18n="server.freshHome.exit"></button>
        </div>
      </div>

      <div id="external-panel" class="section hidden">
        <!-- 多行输入：服务地址带 43 字符令牌，单行框里只能横向滚动；这里整段换行显示，
             并由 .ext-row 撑满面板剩余高度，避免卡片下方留出大片空白。 -->
        <div class="ext-row">
          <span class="key" data-i18n="server.ext.address"></span>
          <textarea id="ext-url" rows="3" placeholder="http://127.0.0.1:3456" spellcheck="false" data-i18n-aria-label="server.ext.address"></textarea>
        </div>
        <div id="ext-state" class="ext-state"></div>
        <div class="actions actions-bar">
          <button id="ext-connect" class="btn btn-primary" data-i18n="server.ext.connect"></button>
          <button id="ext-disconnect" class="btn" data-i18n="server.ext.disconnect"></button>
        </div>
      </div>

      <div id="dlg-error" class="error"></div>
    </div>
  </div>
</div>

<!-- 工具链市场弹框 -->
<div id="tools-modal" class="modal hidden">
  <div class="modal-card modal-tools">
    <div class="modal-head">
      <span class="modal-title"><span class="brand-dot"></span><span data-i18n="tools.title"></span></span>
      <button class="modal-close" data-close="tools-modal" data-i18n-aria-label="common.close">×</button>
    </div>
    <div class="modal-body market-body">
      <!-- 分类页签 + 搜索 + 刷新索引 -->
      <div class="market-toolbar">
        <!-- 分类页签由 renderMarketTabs 按清单里实际出现的分类生成：清单来自独立发布的
             远程索引，客户端与它版本错配时，写死的页签会变成点不出内容的空页签。 -->
        <div id="market-tabs" class="market-tabs"></div>
        <input id="market-search" type="text" spellcheck="false" data-i18n-placeholder="tools.search" data-i18n-aria-label="tools.search">
        <button id="market-refresh" class="btn btn-quiet" data-i18n-title="tools.refreshIndexTitle" data-i18n="tools.refreshIndex"></button>
      </div>
      <!-- 可更新提示条 -->
      <div id="market-update-banner" class="market-update-banner hidden">
        <span class="update-badge">!</span>
        <span id="market-update-text"></span>
        <button id="market-update-all" class="btn btn-warn btn-sm" data-i18n="tools.updateAll"></button>
      </div>

      <!-- 工具卡片网格 -->
      <div id="market-grid" class="market-grid" data-i18n-aria-label="tools.gridLabel"></div>

      <!-- 状态栏 + 内置按钮（footer 布局：statusbar 文本 + 右侧按钮） -->
      <div class="market-footer">
        <div id="market-statusbar" class="market-statusbar" role="status"></div>
        <button id="builtin-toggle" class="builtin-toggle" data-i18n="tools.builtin"></button>
      </div>
      <div id="builtin-panel" class="builtin-panel hidden" data-i18n-aria-label="tools.builtinLabel"></div>
      <div id="toolchain-notice" class="hint"></div>

      <!-- 宿主导入是高级路径：默认折叠成一行，折叠态由 #hosts-summary 报出已挂载项数，
           展开后才出现扫描与挂载表单（绑定见 app.js 的 setupHostsToggle）。 -->
      <section id="card-hosts" class="tool-card" data-i18n-aria-label="tools.hostsLabel">
        <button id="hosts-toggle" class="tool-card-toggle" aria-expanded="false" aria-controls="hosts-body">
          <span class="tool-card-toggle-chevron" aria-hidden="true">▸</span>
          <span data-i18n="tools.hostsTitle"></span>
          <span id="hosts-summary" class="tool-card-toggle-summary"></span>
        </button>
        <div id="hosts-body" class="hosts-body hidden">
          <div class="host-row">
            <button id="host-scan" class="btn btn-quiet" data-i18n="tools.hostScan"></button>
            <input id="host-path" type="text" spellcheck="false" data-i18n-placeholder="tools.hostPathPlaceholder">
            <input id="host-name" type="text" spellcheck="false" data-i18n-placeholder="tools.hostNamePlaceholder">
            <button id="host-add" class="btn btn-primary" data-i18n="tools.hostAdd"></button>
          </div>
          <div id="host-scan-list" class="host-scan-list"></div>
          <div id="host-list" class="host-list"></div>
          <div id="host-hint" class="hint"></div>
        </div>
      </section>

      <div class="actions">
        <button id="tools-refresh" class="btn btn-quiet" data-i18n="tools.recheck"></button>
      </div>
    </div>
  </div>
</div>

<!-- 诊断与修复弹框 -->
<div id="doctor-modal" class="modal hidden">
  <div class="modal-card modal-lg">
    <div class="modal-head">
      <span class="modal-title"><span class="brand-dot"></span>诊断与修复</span>
      <button class="modal-close" data-close="doctor-modal">×</button>
    </div>
    <div class="modal-body">
      <div id="doctor-summary" class="doctor-summary">
        <span id="doctor-summary-text" class="doctor-summary-text">点击"开始诊断"检查环境、配置、插件和会话数据。</span>
        <button id="doctor-refresh" class="btn hidden">重新诊断</button>
      </div>
      <div id="doctor-content" class="doctor-content hidden">
        <div id="doctor-checks" class="doctor-checks"></div>
        <div id="repair-plans" class="repair-plans hidden"></div>
        <div id="doctor-repair-output" class="doctor-repair-output hidden">
          <div class="repair-panel">
            <div class="repair-panel-head">
              <span class="repair-panel-title">修复结果</span>
              <span id="repair-panel-status" class="repair-panel-status"></span>
            </div>
            <div id="repair-panel-body" class="repair-panel-body"></div>
            <div id="repair-panel-backup" class="repair-panel-backup hidden"></div>
          </div>
        </div>
      </div>
      <div class="doctor-actions-start">
        <button id="doctor-start" class="btn btn-primary">开始诊断</button>
      </div>
    </div>
  </div>
</div>

<!-- 终端弹框 -->
<div id="terminal-modal" class="modal hidden">
  <!-- 遮罩与卡片是两个元素：最大化状态必须挂在卡片 #terminal-card 上，
       CSS 的 .modal-terminal.is-maximized 才匹配得到（遮罩只负责居中与压暗） -->
  <div id="terminal-card" class="modal-card modal-terminal">
    <div id="terminal-head" class="modal-head">
      <span class="modal-title"><span class="brand-dot"></span>终端</span>
      <span class="modal-head-actions">
        <!-- 最大化/还原共用一颗按钮，两套图标按 is-maximized 切换，按钮不跳位 -->
        <button id="terminal-max" class="modal-close" title="最大化" aria-label="最大化">
          <svg class="terminal-icon-max" width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.2" aria-hidden="true"><rect x="3" y="3" width="10" height="10" rx="1"/></svg>
          <svg class="terminal-icon-restore" width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.2" aria-hidden="true"><rect x="2.5" y="5.5" width="8" height="8" rx="1"/><path d="M5.5 5.5v-2a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v6a1 1 0 0 1-1 1h-2"/></svg>
        </button>
        <button class="modal-close" data-close="terminal-modal" aria-label="关闭">×</button>
      </span>
    </div>
    <div class="modal-body terminal-body">
      <!-- 标签条整行承载工具栏背景，「新建」按钮与标签同排靠右 -->
      <div class="terminal-tabbar">
        <div id="terminal-tabs" class="terminal-tabs"></div>
        <!-- 字号缩放：读数夹在两个按钮中间，到达上下限时按钮由脚本置灰 -->
        <button id="terminal-font-dec" class="icon-btn-sm terminal-font-btn" title="缩小字号" aria-label="缩小字号">A−</button>
        <span id="terminal-font-size" class="terminal-font-size" title="当前字号">14</span>
        <button id="terminal-font-inc" class="icon-btn-sm terminal-font-btn" title="放大字号" aria-label="放大字号">A+</button>
        <button id="terminal-new" class="icon-btn-sm" title="新建终端">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        </button>
      </div>
      <!-- xterm 实例的挂载容器：每个会话一个 .terminal-holder 子节点，
           切换标签时整体搬运 DOM 节点以保留各自的滚动历史与光标状态 -->
      <div id="terminal-content" class="terminal-content"></div>
    </div>
  </div>
</div>

<!-- Git 凭据弹框 -->
<!-- 关于弹框 -->
<div id="about-modal" class="modal hidden">
  <div class="modal-card modal-sm">
    <div class="modal-head">
      <span class="modal-title"><span class="brand-dot"></span><span data-i18n="about.title"></span></span>
      <button class="modal-close" data-close="about-modal">×</button>
    </div>
    <div class="modal-body about">
      <svg id="about-logo" class="about-logo" viewBox="0 0 50 50" fill="none" aria-hidden="true"><use href="#dsh-whale"/></svg>
      <div class="about-title">DeepSeek Harness</div>
      <!-- 事实全部来自 App.About()，这里只留标签与占位节点；两个仓库地址
           必须同时给出——它们对应不同的责任方，只留一个会让用户报错地方。 -->
      <dl class="about-meta">
        <dt data-i18n="about.harnessVersion"></dt><dd id="about-harness-version"></dd>
        <dt data-i18n="about.upstreamRepo"></dt><dd><a id="about-upstream" href="#" target="_blank"></a></dd>
        <dt data-i18n="about.packageVersion"></dt><dd id="about-package-version"></dd>
        <dt data-i18n="about.packager"></dt><dd id="about-packager"></dd>
        <dt data-i18n="about.repo"></dt><dd><a id="about-repo" href="#" target="_blank"></a></dd>
      </dl>
    </div>
  </div>
</div>

<!-- 终端模拟器（xterm.js 5.5.0 + fit 插件 0.10.0，本地 vendor 离线加载）：
     UMD 构建在浏览器环境暴露 window.Terminal 与 window.FitAddon.FitAddon -->
<script src="vendor/xterm.js"></script>
<script src="vendor/addon-fit.js"></script>
<!-- 国际化：字典先挂到全局，i18n.js 再据此建立门面，app.js 最后消费。
     顺序不可调换——i18n.js 在初始化时要读 window.DSH_LOCALES，app.js 在首次
     渲染前要调 window.DSHI18N.init()。见 docs/i18n.md 6.1 -->
<script src="locales/zh.js"></script>
<script src="locales/en.js"></script>
<script src="i18n.js"></script>
<script src="app.js"></script>
</body>
